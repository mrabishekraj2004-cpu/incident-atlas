# Optional, separate hosted workspace pilot. Applying this Blueprint provisions
# paid Render services. Review current pricing and approval before applying it.
services:
  - type: web
    name: incident-atlas-pilot-api
    runtime: docker
    plan: starter
    region: oregon
    dockerContext: .
    dockerfilePath: ./Dockerfile
    preDeployCommand: >-
      uv run --no-sync python -m incident_atlas.cli deploy-bootstrap
      && uv run --no-sync python -m incident_atlas.pilot_cli seed
    dockerCommand: ./docker-start.sh
    healthCheckPath: /readyz
    maxShutdownDelaySeconds: 30
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PILOT_ENABLED
        value: "true"
      - key: PILOT_DEV_AUTH_ENABLED
        value: "false"
      - key: PILOT_OIDC_ISSUER
        sync: false
      - key: PILOT_OIDC_AUDIENCE
        sync: false
      - key: PILOT_OIDC_JWKS_URL
        sync: false
      - key: PILOT_RETENTION_DAYS
        value: "30"
      - key: PILOT_INGEST_TOKEN_TTL_DAYS
        value: "90"
      - key: PILOT_MAX_PAYLOAD_BYTES
        value: "65536"
      - key: PILOT_MAX_INGEST_RECORDS
        value: "500"
      - key: GITHUB_WEBHOOK_SECRETS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: RUNTIME_DB_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: PUBLIC_SITE_ORIGIN
        sync: false
      - key: TRUSTED_PROXY_CIDRS
        sync: false
      - key: RATE_LIMIT_HMAC_KEY
        generateValue: true
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: LIVE_ANALYSIS_ENABLED
        value: "false"
      - key: LIVE_PROVIDER_VERIFIED
        value: "false"
      - key: LOG_LEVEL
        value: INFO

databases:
  - name: incident-atlas-pilot-db
    databaseName: incident_atlas_pilot
    user: incident_atlas_pilot
    plan: basic-256mb
    region: oregon
