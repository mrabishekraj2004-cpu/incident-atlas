services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: incident_atlas
      POSTGRES_USER: incident_atlas
      POSTGRES_PASSWORD: incident_atlas_local_only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incident_atlas -d incident_atlas"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://incident_atlas:incident_atlas_local_only@db:5432/incident_atlas
      CORS_ALLOWED_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'
      RATE_LIMIT_HMAC_KEY: local-compose-only-change-before-hosting
      PILOT_ENABLED: ${PILOT_ENABLED:-true}
      PILOT_DEV_AUTH_ENABLED: ${PILOT_DEV_AUTH_ENABLED:-true}
      PILOT_MAX_PAYLOAD_BYTES: ${PILOT_MAX_PAYLOAD_BYTES:-65536}
      PILOT_RETENTION_DAYS: ${PILOT_RETENTION_DAYS:-30}
      GITHUB_WEBHOOK_SECRETS: ${GITHUB_WEBHOOK_SECRETS:-}
      LIVE_ANALYSIS_ENABLED: ${LIVE_ANALYSIS_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6.1-terra}
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully

  bootstrap:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uv", "run", "python", "-m", "incident_atlas.cli", "bootstrap-runtime"]
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://incident_atlas:incident_atlas_local_only@db:5432/incident_atlas
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    image: node:22-alpine
    working_dir: /workspace/web
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_BASE_URL: /api/v1
      VITE_API_PROXY_TARGET: http://api:8000
      VITE_DATA_MODE: api
      VITE_PILOT_ENABLED: "true"
      VITE_OIDC_AUTHORITY: ${VITE_OIDC_AUTHORITY:-}
      VITE_OIDC_CLIENT_ID: ${VITE_OIDC_CLIENT_ID:-}
      VITE_OIDC_REDIRECT_URI: ${VITE_OIDC_REDIRECT_URI:-}
    ports:
      - "5173:5173"
    volumes:
      - ./web:/workspace/web
      - web_node_modules:/workspace/web/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  web_node_modules:
